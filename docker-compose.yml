services:
  postgres:
    image: postgres:16-alpine
    container_name: smartpark-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartpark
      POSTGRES_PASSWORD: smartpark
      POSTGRES_DB: smartpark
    ports:
      - "5432:5432"
    volumes:
      - smartpark_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartpark -d smartpark"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  smartpark_pgdata:
